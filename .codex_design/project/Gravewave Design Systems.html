<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravewave · Design Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Cinzel:wght@500;600;700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#1a1714; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel" src="top-down.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas title="Gravewave · Design Directions">
      <DCSection id="topdown" title="Top-down · vertical (matches the actual game)">
        <DCArtboard id="td-feasibility" label="00 · feasibility note" width={520} height={860}>
          <window.FeasibilityCard />
        </DCArtboard>
        <DCArtboard id="td-crypt" label="01 · CRYPT.GB · top-down" width={460} height={900}>
          <window.CryptGBTopDownCard />
        </DCArtboard>
        <DCArtboard id="td-sumi" label="02 · Sumi & Grave · top-down" width={460} height={900}>
          <window.SumiGraveTopDownCard />
        </DCArtboard>
        <DCArtboard id="td-necroterm" label="04 · NECROTERM · top-down" width={460} height={900}>
          <window.NecroTermTopDownCard />
        </DCArtboard>
      </DCSection>
      <DCSection id="systems" title="Earlier side-on sketches (not the real camera) — kept for reference">
        <DCArtboard id="crypt-gb" label="01 · CRYPT.GB — pixel demake" width={780} height={580}>
          <window.CryptGBCard />
        </DCArtboard>
        <DCArtboard id="sumi" label="02 · Sumi & Grave — ink wash" width={780} height={580}>
          <window.SumiGraveCard />
        </DCArtboard>
        <DCArtboard id="hex" label="03 · HEX.ARCADE — neon vector" width={780} height={580}>
          <window.HexArcadeCard />
        </DCArtboard>
        <DCArtboard id="necroterm" label="04 · NECROTERM — ASCII terminal" width={780} height={580}>
          <window.NecroTermCard />
        </DCArtboard>
        <DCArtboard id="reliquary" label="05 · Reliquary — tarot watercolor" width={780} height={580}>
          <window.ReliquaryCard />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
